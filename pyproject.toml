[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance"
version = "0.1.0"
description = "Local face recognition attendance system with a desktop UI and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "face-recognition contributors"}]
keywords = [
    "attendance",
    "biometrics",
    "computer-vision",
    "face-recognition",
    "liveness",
    "opencv",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "face-recognition>=1.3.0,<2",
    "face-recognition-models>=0.3,<1",
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "Pillow>=10,<13",
    "setuptools>=68,<85",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
face-attendance = "face_attendance.cli:main"
face-attendance-gui = "face_attendance.main:main"

[project.urls]
Homepage = "https://github.com/ogc16/face-recognition"
Source = "https://github.com/ogc16/face-recognition"
Issues = "https://github.com/ogc16/face-recognition/issues"
Changelog = "https://github.com/ogc16/face-recognition/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"util.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = ["src", "main.py", "util.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
