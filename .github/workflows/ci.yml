name: CI

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install "mypy>=1.10,<2" "pytest>=8,<10" "pytest-cov>=5,<8" "ruff>=0.6,<1"
      - name: Test
        run: python -m pytest --cov=face_attendance --cov-report=term-missing
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Compile
        run: python -m compileall -q src main.py util.py
