name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install "mypy>=1.10,<2" "pytest>=8,<10" "pytest-cov>=5,<8" "ruff>=0.6,<1"
      - name: Test
        run: python -m pytest --cov=face_attendance --cov-report=term-missing
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Compile
        run: python -m compileall -q src main.py util.py

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2"
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
