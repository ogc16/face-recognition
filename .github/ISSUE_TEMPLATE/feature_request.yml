name: Feature request
description: Suggest an improvement to Face Attendance
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution and its trade-offs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or designs you evaluated.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy
      options:
        - label: This proposal has been reviewed for biometric-data and privacy impact.
          required: false
